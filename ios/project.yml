# XcodeGen spec for the Keys iOS shell. Keys.xcodeproj is generated from this and committed,
# so XcodeGen is only needed if you change the project structure: `cd ios && xcodegen`.
name: Keys
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Keys:
    type: application
    platform: iOS
    sources:
      - Keys
    settings:
      base:
        # Change to something unique to you before running on a device (see README).
        PRODUCT_BUNDLE_IDENTIFIER: com.example.keys
        PRODUCT_NAME: Keys
        INFOPLIST_FILE: Keys/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: NO
schemes:
  Keys:
    build:
      targets:
        Keys: all
    run:
      config: Debug
    archive:
      config: Release
